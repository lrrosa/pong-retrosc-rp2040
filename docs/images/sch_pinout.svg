<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="659" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Mapa de pinos usados — Raspberry Pi Pico (RP2040)</text>

  <!-- Pico body -->
  <rect x="310" y="50" width="40" height="14" rx="3" fill="#eef4ff" stroke="#16202a"/>
  <text x="330" y="61" text-anchor="middle" font-size="10" fill="#16202a">USB</text>
  <rect x="250" y="64" width="160" height="338" rx="10" fill="#eef4ff" stroke="#16202a"/>
  <text x="330" y="90" text-anchor="middle" font-weight="bold" fill="#16202a">Pico</text>

  <!-- Left pins -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="250" y1="120" x2="196" y2="120"/>
    <line x1="250" y1="162" x2="196" y2="162"/>
    <line x1="250" y1="204" x2="196" y2="204"/>
    <line x1="250" y1="246" x2="196" y2="246"/>
    <line x1="250" y1="288" x2="196" y2="288"/>
    <line x1="250" y1="330" x2="196" y2="330"/>
  </g>
  <g fill="#16202a">
    <circle cx="196" cy="120" r="3"/><circle cx="196" cy="162" r="3"/>
    <circle cx="196" cy="204" r="3"/><circle cx="196" cy="246" r="3"/>
    <circle cx="196" cy="288" r="3"/><circle cx="196" cy="330" r="3"/>
  </g>
  <g font-size="11" fill="#16202a">
    <text x="258" y="124">GP16 p21</text>
    <text x="258" y="166">GP17 p22</text>
    <text x="258" y="208">GP18 p24</text>
    <text x="258" y="250">GP22 p29</text>
    <text x="258" y="292">GP26 p31</text>
    <text x="258" y="334">GP27 p32</text>
  </g>
  <g text-anchor="end" fill="#16202a">
    <text x="190" y="124">SYNC  →  DAC de vídeo</text>
    <text x="190" y="166">VIDEO →  DAC de vídeo</text>
    <text x="190" y="208">AUDIO →  filtro + amp</text>
    <text x="190" y="250">START ←  botão</text>
    <text x="190" y="292">P1 ←  pot esquerdo</text>
    <text x="190" y="334">P2 ←  pot direito</text>
  </g>

  <!-- Right pins (conexões físicas no header) -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="410" y1="120" x2="464" y2="120"/>
    <line x1="410" y1="190" x2="464" y2="190"/>
    <line x1="410" y1="260" x2="464" y2="260"/>
    <line x1="410" y1="330" x2="464" y2="330"/>
  </g>
  <g fill="#16202a">
    <circle cx="464" cy="120" r="3"/><circle cx="464" cy="190" r="3"/>
    <circle cx="464" cy="260" r="3"/><circle cx="464" cy="330" r="3"/>
  </g>
  <g font-size="11" fill="#16202a" text-anchor="end">
    <text x="402" y="124">3V3 p36</text>
    <text x="402" y="194">AGND p33</text>
    <text x="402" y="264">GND p38</text>
    <text x="402" y="334">VBUS p40</text>
  </g>
  <g fill="#16202a">
    <text x="472" y="124">→  alimenta os pots</text>
    <text x="472" y="194">→  terra dos pots</text>
    <text x="472" y="264">→  terra comum</text>
    <text x="472" y="334">→  5 V ao amp</text>
  </g>

  <text x="330" y="420" text-anchor="middle" fill="#5b6b7a" font-size="12">Só pinos do header. GP23 (modo PWM do SMPS) é interno e setado por firmware.</text>
</svg>
