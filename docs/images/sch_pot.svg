<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="559" height="249" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Potenciômetro 10 kΩ linear  (×2: P1=GP26, P2=GP27)</text>

  <!-- 3V3 -->
  <text x="70" y="60" text-anchor="middle" font-weight="bold" fill="#16202a">+3V3</text>

  <!-- pot body -->
  <rect x="40" y="86" width="80" height="76" rx="4" fill="#ffffff" stroke="#16202a"/>
  <text x="80" y="118" text-anchor="middle" fill="#16202a">10 kΩ</text>
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#5b6b7a">linear</text>

  <!-- wires top/bottom -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="70" y1="66" x2="70" y2="86"/>
    <line x1="70" y1="162" x2="70" y2="196"/>
    <line x1="120" y1="124" x2="210" y2="124"/>
    <line x1="210" y1="124" x2="360" y2="124"/>
    <line x1="210" y1="124" x2="210" y2="170"/>
    <line x1="210" y1="178" x2="210" y2="200"/>
  </g>
  <!-- wiper arrow into body -->
  <polygon points="120,124 134,118 134,130" fill="#16202a"/>
  <text x="165" y="115" text-anchor="middle" font-size="11" fill="#5b6b7a">wiper</text>
  <circle cx="210" cy="124" r="3.5" fill="#16202a"/>

  <!-- AGND (bottom) -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="58" y1="196" x2="82" y2="196"/>
    <line x1="62" y1="201" x2="78" y2="201"/>
    <line x1="66" y1="206" x2="74" y2="206"/>
  </g>
  <text x="90" y="200" fill="#5b6b7a" font-size="12">AGND</text>

  <!-- 100nF to GND -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="192" y1="170" x2="228" y2="170"/>
    <line x1="192" y1="178" x2="228" y2="178"/>
    <line x1="198" y1="200" x2="222" y2="200"/>
    <line x1="202" y1="205" x2="218" y2="205"/>
    <line x1="206" y1="210" x2="214" y2="210"/>
  </g>
  <text x="238" y="179" fill="#5b6b7a" font-size="12">100 nF</text>

  <!-- output -->
  <polygon points="360,118 373,124 360,130" fill="#2563eb"/>
  <text x="380" y="121" fill="#2563eb">→ GP26 / GP27</text>
  <text x="380" y="137" fill="#5b6b7a" font-size="12">(ADC0 / ADC1)</text>

  <text x="280" y="238" text-anchor="middle" fill="#5b6b7a" font-size="12">wiper → ADC  ·  100 nF reduz ruído do ADC  ·  AGND = p33 no Pico, p29 na roxa</text>
</svg>
