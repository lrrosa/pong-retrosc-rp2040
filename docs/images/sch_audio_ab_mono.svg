<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="699" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Variante mono — chave DPDT (2 polos, 6 pinos)</text>
  <text x="20" y="52" fill="#5b6b7a" font-size="11">linha cheia = posição A (TV) ·</text>
  <text x="216" y="52" fill="#d1242f" font-size="11">tracejado vermelho = posição B (amp)</text>

  <!-- ================= vista de baixo ================= -->
  <text x="125" y="86" text-anchor="middle" fill="#16202a" font-weight="bold" font-size="12">Vista de baixo</text>
  <rect x="60" y="100" width="130" height="200" rx="3" fill="#ffffff" stroke="#16202a" stroke-width="2"/>

  <rect x="85" y="125" width="18" height="30" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="147" y="125" width="18" height="30" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="85" y="180" width="18" height="30" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <rect x="147" y="180" width="18" height="30" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <rect x="85" y="235" width="18" height="30" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="147" y="235" width="18" height="30" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>

  <g font-weight="bold" fill="#16202a">
    <text x="78" y="145" text-anchor="end">1</text>
    <text x="172" y="145">2</text>
    <text x="78" y="200" text-anchor="end">3</text>
    <text x="172" y="200">4</text>
    <text x="78" y="260" text-anchor="end">5</text>
    <text x="172" y="260">6</text>
  </g>
  <text x="125" y="322" text-anchor="middle" fill="#5b6b7a" font-size="11">3 e 4 = comuns</text>
  <text x="125" y="338" text-anchor="middle" fill="#5b6b7a" font-size="11">(fileira do meio)</text>

  <!-- ================= esquema ================= -->
  <text x="500" y="86" text-anchor="middle" fill="#16202a" font-weight="bold" font-size="12">Ligações</text>

  <!-- terminals -->
  <circle cx="520" cy="120" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="520" cy="180" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="520" cy="240" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="520" cy="300" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <g font-weight="bold" fill="#16202a">
    <text x="530" y="125">1</text>
    <text x="530" y="185">5</text>
    <text x="530" y="245">2</text>
    <text x="530" y="305">6</text>
  </g>
  <g fill="#16202a">
    <text x="548" y="125">LINHA (divisor)</text>
    <text x="548" y="185">Lout+</text>
    <text x="548" y="245">GND (estrela)</text>
    <text x="548" y="305">Lout−</text>
  </g>

  <!-- commons -->
  <circle cx="400" cy="150" r="4" fill="#16202a"/>
  <circle cx="400" cy="270" r="4" fill="#16202a"/>
  <text x="392" y="140" text-anchor="end" font-weight="bold" fill="#16202a">3</text>
  <text x="392" y="288" text-anchor="end" font-weight="bold" fill="#16202a">4</text>
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="400" y1="150" x2="336" y2="150"/>
    <line x1="400" y1="270" x2="336" y2="270"/>
  </g>
  <polygon points="336,144 323,150 336,156" fill="#2563eb"/>
  <polygon points="336,264 323,270 336,276" fill="#2563eb"/>
  <text x="316" y="147" text-anchor="end" fill="#2563eb" font-size="12">centros dos RCAs</text>
  <text x="316" y="163" text-anchor="end" fill="#5b6b7a" font-size="11">(L e R juntos)</text>
  <text x="316" y="267" text-anchor="end" fill="#2563eb" font-size="12">shields dos RCAs</text>
  <text x="316" y="283" text-anchor="end" fill="#5b6b7a" font-size="11">(L e R juntos)</text>

  <!-- wipers -->
  <line x1="400" y1="150" x2="516" y2="123" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="150" x2="516" y2="177" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="400" y1="270" x2="516" y2="243" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="270" x2="516" y2="297" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- ganged -->
  <line x1="460" y1="136" x2="460" y2="256" stroke="#9aa7b3" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="452" y="200" text-anchor="end" fill="#5b6b7a" font-size="11">ganged</text>

  <text x="350" y="374" text-anchor="middle" fill="#5b6b7a" font-size="12">Áudio do Pong é mono: só o canal Lout é usado (Rout fica livre).</text>
  <text x="350" y="394" text-anchor="middle" fill="#d1242f" font-size="12">Meça antes: 3 e 4 não podem ter continuidade entre si (comuns independentes).</text>
  <text x="350" y="414" text-anchor="middle" fill="#5b6b7a" font-size="12">Modo B: só UMA caixa passiva · RCAs isolados do painel · nunca a TV em B.</text>
</svg>
