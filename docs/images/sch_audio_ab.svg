<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="699" height="521" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Variante estéreo — chave 4PDT (4 polos, 12 pinos)</text>
  <text x="20" y="52" fill="#5b6b7a" font-size="11">linha cheia = posição A (TV) ·</text>
  <text x="216" y="52" fill="#d1242f" font-size="11">tracejado vermelho = posição B (amp)</text>

  <!-- ================= vista de baixo ================= -->
  <text x="120" y="86" text-anchor="middle" fill="#16202a" font-weight="bold" font-size="12">Vista de baixo</text>
  <rect x="40" y="100" width="160" height="170" rx="3" fill="#ffffff" stroke="#16202a" stroke-width="2"/>

  <!-- row 1 -->
  <rect x="56" y="130" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="92" y="130" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="128" y="130" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="164" y="130" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <!-- row 2 (comuns) -->
  <rect x="56" y="172" width="20" height="26" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <rect x="92" y="172" width="20" height="26" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <rect x="128" y="172" width="20" height="26" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <rect x="164" y="172" width="20" height="26" rx="2" fill="#eef4ff" stroke="#16202a" stroke-width="2"/>
  <!-- row 3 -->
  <rect x="56" y="214" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="92" y="214" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="128" y="214" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <rect x="164" y="214" width="20" height="26" rx="2" fill="#ffffff" stroke="#16202a" stroke-width="2"/>

  <g font-weight="bold" fill="#16202a" font-size="11" text-anchor="middle">
    <text x="66" y="148">1</text>
    <text x="102" y="148">2</text>
    <text x="138" y="148">3</text>
    <text x="174" y="148">4</text>
    <text x="66" y="190">5</text>
    <text x="102" y="190">6</text>
    <text x="138" y="190">7</text>
    <text x="174" y="190">8</text>
    <text x="66" y="232">9</text>
    <text x="102" y="232">10</text>
    <text x="138" y="232">11</text>
    <text x="174" y="232">12</text>
  </g>
  <text x="120" y="292" text-anchor="middle" fill="#5b6b7a" font-size="11">colunas = polos</text>
  <text x="120" y="308" text-anchor="middle" fill="#5b6b7a" font-size="11">5–8 = comuns (meio)</text>

  <!-- ================= esquema ================= -->
  <text x="500" y="86" text-anchor="middle" fill="#16202a" font-weight="bold" font-size="12">Ligações</text>

  <!-- polo 1 -->
  <circle cx="400" cy="130" r="4" fill="#16202a"/>
  <text x="400" y="118" text-anchor="middle" font-weight="bold" fill="#16202a">5</text>
  <line x1="400" y1="130" x2="340" y2="130" stroke="#16202a" stroke-width="2"/>
  <polygon points="340,124 327,130 340,136" fill="#2563eb"/>
  <text x="320" y="134" text-anchor="end" fill="#2563eb" font-size="12">centro do RCA-L</text>
  <line x1="400" y1="130" x2="496" y2="113" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="130" x2="496" y2="152" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="500" cy="110" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="500" cy="155" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <text x="510" y="115" font-weight="bold" fill="#16202a">1</text>
  <text x="528" y="115" fill="#16202a">LINHA (divisor)</text>
  <text x="510" y="160" font-weight="bold" fill="#16202a">9</text>
  <text x="528" y="160" fill="#16202a">Lout+</text>

  <!-- polo 2 -->
  <circle cx="400" cy="215" r="4" fill="#16202a"/>
  <text x="400" y="203" text-anchor="middle" font-weight="bold" fill="#16202a">6</text>
  <line x1="400" y1="215" x2="340" y2="215" stroke="#16202a" stroke-width="2"/>
  <polygon points="340,209 327,215 340,221" fill="#2563eb"/>
  <text x="320" y="219" text-anchor="end" fill="#2563eb" font-size="12">shield do RCA-L</text>
  <line x1="400" y1="215" x2="496" y2="198" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="215" x2="496" y2="237" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="500" cy="195" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="500" cy="240" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <text x="510" y="200" font-weight="bold" fill="#16202a">2</text>
  <text x="528" y="200" fill="#16202a">GND áudio (p38)</text>
  <text x="510" y="245" font-weight="bold" fill="#16202a">10</text>
  <text x="536" y="245" fill="#16202a">Lout−</text>

  <!-- polo 3 -->
  <circle cx="400" cy="300" r="4" fill="#16202a"/>
  <text x="400" y="288" text-anchor="middle" font-weight="bold" fill="#16202a">7</text>
  <line x1="400" y1="300" x2="340" y2="300" stroke="#16202a" stroke-width="2"/>
  <polygon points="340,294 327,300 340,306" fill="#2563eb"/>
  <text x="320" y="304" text-anchor="end" fill="#2563eb" font-size="12">centro do RCA-R</text>
  <line x1="400" y1="300" x2="496" y2="283" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="300" x2="496" y2="322" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="500" cy="280" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="500" cy="325" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <text x="510" y="285" font-weight="bold" fill="#16202a">3</text>
  <text x="528" y="285" fill="#16202a">LINHA (divisor)</text>
  <text x="510" y="330" font-weight="bold" fill="#16202a">11</text>
  <text x="536" y="330" fill="#16202a">Rout+</text>

  <!-- polo 4 -->
  <circle cx="400" cy="385" r="4" fill="#16202a"/>
  <text x="400" y="373" text-anchor="middle" font-weight="bold" fill="#16202a">8</text>
  <line x1="400" y1="385" x2="340" y2="385" stroke="#16202a" stroke-width="2"/>
  <polygon points="340,379 327,385 340,391" fill="#2563eb"/>
  <text x="320" y="389" text-anchor="end" fill="#2563eb" font-size="12">shield do RCA-R</text>
  <line x1="400" y1="385" x2="496" y2="368" stroke="#16202a" stroke-width="2"/>
  <line x1="400" y1="385" x2="496" y2="407" stroke="#d1242f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="500" cy="365" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <circle cx="500" cy="410" r="4" fill="#ffffff" stroke="#16202a" stroke-width="2"/>
  <text x="510" y="370" font-weight="bold" fill="#16202a">4</text>
  <text x="528" y="370" fill="#16202a">GND áudio (p38)</text>
  <text x="510" y="415" font-weight="bold" fill="#16202a">12</text>
  <text x="536" y="415" fill="#16202a">Rout−</text>

  <!-- ganged -->
  <line x1="455" y1="120" x2="455" y2="375" stroke="#9aa7b3" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="448" y="258" text-anchor="end" fill="#5b6b7a" font-size="11">ganged</text>

  <text x="350" y="452" text-anchor="middle" fill="#d1242f" font-size="12">A numeração varia por fabricante — confirme com multímetro (roteiro da DPDT).</text>
  <text x="350" y="472" text-anchor="middle" fill="#5b6b7a" font-size="12">RCAs isolados do painel · no modo B o shield é saída ativa · nunca a TV em B.</text>
  <text x="350" y="494" text-anchor="middle" fill="#5b6b7a" font-size="12">GND aqui = terra do áudio (pino 38) — NÃO o AGND (33), exclusivo dos pots.</text>
</svg>
