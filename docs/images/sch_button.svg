<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="559" height="261" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Botão START — push-button NA (só 2 fios: GP22 e GND)</text>

  <!-- ===== interno ao RP2040 (pull-up) ===== -->
  <rect x="162" y="60" width="96" height="64" rx="8" fill="#f6f8fa" stroke="#9aa7b3" stroke-dasharray="5 3"/>
  <text x="210" y="74" text-anchor="middle" font-weight="bold" fill="#5b6b7a">+3V3</text>
  <g stroke="#9aa7b3" stroke-width="2" fill="none" stroke-dasharray="5 3">
    <line x1="210" y1="80" x2="210" y2="90"/>
    <line x1="210" y1="112" x2="210" y2="140"/>
  </g>
  <rect x="186" y="90" width="48" height="22" rx="3" fill="#ffffff" stroke="#9aa7b3" stroke-dasharray="5 3"/>
  <text x="210" y="106" text-anchor="middle" font-size="11" fill="#5b6b7a">≈60 kΩ</text>
  <text x="268" y="92" fill="#5b6b7a" font-size="11">interno ao RP2040</text>
  <text x="268" y="108" fill="#5b6b7a" font-size="11">(pull-up — não fiar)</text>

  <!-- ===== fiação real (GP22 -> botão -> GND) ===== -->
  <rect x="16" y="125" width="120" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="76" y="144" text-anchor="middle" fill="#16202a">GP22 · START</text>

  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="136" y1="140" x2="238" y2="140"/>
    <line x1="310" y1="140" x2="388" y2="140"/>
    <line x1="388" y1="140" x2="388" y2="184"/>
  </g>
  <circle cx="210" cy="140" r="3.5" fill="#9aa7b3"/>

  <!-- switch (open) -->
  <circle cx="238" cy="140" r="3.5" fill="#ffffff" stroke="#16202a"/>
  <circle cx="310" cy="140" r="3.5" fill="#ffffff" stroke="#16202a"/>
  <line x1="238" y1="140" x2="304" y2="121" stroke="#16202a" stroke-width="2"/>
  <text x="274" y="174" text-anchor="middle" font-size="11" fill="#5b6b7a">botão (NA)</text>

  <!-- GND -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="376" y1="184" x2="400" y2="184"/>
    <line x1="380" y1="189" x2="396" y2="189"/>
    <line x1="384" y1="194" x2="392" y2="194"/>
  </g>

  <text x="280" y="224" text-anchor="middle" fill="#5b6b7a" font-size="12">Aberto: GP22 = 3,3 V (pull-up interno)  ·  Pressionado: GP22 = GND (flanco de descida)</text>
  <text x="280" y="244" text-anchor="middle" fill="#5b6b7a" font-size="12">Drena só ~55 µA: o GND pode ser o mesmo fio do vídeo (não precisa de fio próprio).</text>
</svg>
