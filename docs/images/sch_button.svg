<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="539" height="229" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Botão START — push-button NA (normalmente aberto)</text>

  <!-- pin -->
  <rect x="16" y="110" width="120" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="76" y="129" text-anchor="middle" fill="#16202a">GP22 · START</text>

  <!-- wires -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="136" y1="125" x2="240" y2="125"/>
    <line x1="312" y1="125" x2="380" y2="125"/>
    <line x1="380" y1="125" x2="380" y2="168"/>
  </g>
  <circle cx="220" cy="125" r="3.5" fill="#16202a"/>

  <!-- switch (open) -->
  <circle cx="240" cy="125" r="3.5" fill="#ffffff" stroke="#16202a"/>
  <circle cx="312" cy="125" r="3.5" fill="#ffffff" stroke="#16202a"/>
  <line x1="240" y1="125" x2="306" y2="106" stroke="#16202a" stroke-width="2"/>
  <text x="276" y="160" text-anchor="middle" font-size="11" fill="#5b6b7a">botão</text>

  <!-- GND -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="368" y1="168" x2="392" y2="168"/>
    <line x1="372" y1="173" x2="388" y2="173"/>
    <line x1="376" y1="178" x2="384" y2="178"/>
  </g>

  <!-- pull-up (internal, dashed) -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="220" y1="125" x2="220" y2="98"/>
    <line x1="220" y1="74" x2="220" y2="60"/>
  </g>
  <rect x="196" y="74" width="48" height="24" rx="3" fill="#ffffff" stroke="#16202a" stroke-dasharray="4 3"/>
  <text x="220" y="91" text-anchor="middle" font-size="11" fill="#5b6b7a">≈60 kΩ</text>
  <text x="220" y="54" text-anchor="middle" font-weight="bold" fill="#16202a">+3V3</text>
  <text x="252" y="91" fill="#5b6b7a" font-size="11">pull-up interno</text>

  <text x="270" y="214" text-anchor="middle" fill="#5b6b7a" font-size="12">Aberto: GP22 = 3,3 V  ·  Pressionado: GP22 = GND (flanco de descida)</text>
</svg>
