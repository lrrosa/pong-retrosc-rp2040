<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="699" height="351" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Áudio — sinal: filtro, divisor de linha e entradas do PAM8403</text>

  <!-- pin -->
  <rect x="16" y="95" width="120" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="76" y="114" text-anchor="middle" fill="#16202a">GP18 · AUDIO</text>

  <!-- R3 -->
  <rect x="166" y="98" width="88" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="210" y="115" text-anchor="middle" fill="#16202a">R3 1 kΩ</text>

  <!-- chain wires -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="136" y1="110" x2="166" y2="110"/>
    <line x1="254" y1="110" x2="306" y2="110"/>
    <line x1="314" y1="110" x2="360" y2="110"/>
    <line x1="360" y1="65" x2="360" y2="155"/>
    <line x1="360" y1="65" x2="400" y2="65"/>
    <line x1="480" y1="65" x2="560" y2="65"/>
    <line x1="520" y1="65" x2="520" y2="88"/>
    <line x1="520" y1="112" x2="520" y2="126"/>
    <line x1="360" y1="155" x2="430" y2="155"/>
    <line x1="430" y1="155" x2="430" y2="205"/>
    <line x1="430" y1="155" x2="460" y2="155"/>
    <line x1="524" y1="155" x2="580" y2="155"/>
    <line x1="430" y1="205" x2="460" y2="205"/>
    <line x1="524" y1="205" x2="580" y2="205"/>
  </g>
  <circle cx="280" cy="110" r="3.5" fill="#16202a"/>
  <circle cx="360" cy="110" r="3.5" fill="#16202a"/>
  <circle cx="520" cy="65" r="3.5" fill="#16202a"/>
  <circle cx="430" cy="155" r="3.5" fill="#16202a"/>
  <circle cx="430" cy="205" r="3.5" fill="#16202a"/>

  <!-- C1 shunt -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="280" y1="110" x2="280" y2="135"/>
    <line x1="262" y1="135" x2="298" y2="135"/>
    <line x1="262" y1="143" x2="298" y2="143"/>
    <line x1="280" y1="143" x2="280" y2="163"/>
    <line x1="268" y1="163" x2="292" y2="163"/>
    <line x1="272" y1="168" x2="288" y2="168"/>
    <line x1="276" y1="173" x2="284" y2="173"/>
  </g>
  <text x="254" y="147" text-anchor="end" fill="#5b6b7a" font-size="12">C1 100 nF</text>

  <!-- C2 series -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="306" y1="96" x2="306" y2="124"/>
    <line x1="314" y1="96" x2="314" y2="124"/>
  </g>
  <text x="310" y="87" text-anchor="middle" fill="#5b6b7a" font-size="12">C2 1 µF</text>

  <!-- line divider (always connected) -->
  <rect x="400" y="53" width="80" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="440" y="70" text-anchor="middle" fill="#16202a">R4 10 kΩ</text>
  <rect x="490" y="88" width="60" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="520" y="105" text-anchor="middle" font-size="12" fill="#16202a">R5 1 kΩ</text>
  <g stroke="#16202a" stroke-width="2">
    <line x1="508" y1="126" x2="532" y2="126"/>
    <line x1="512" y1="131" x2="528" y2="131"/>
    <line x1="516" y1="136" x2="524" y2="136"/>
  </g>
  <polygon points="560,59 573,65 560,71" fill="#2563eb"/>
  <text x="582" y="62" fill="#2563eb">LINHA</text>
  <text x="582" y="78" fill="#5b6b7a" font-size="11">= junção R4/R5</text>
  <text x="582" y="92" fill="#5b6b7a" font-size="11">(lado A da chave)</text>

  <!-- amp inputs (always connected) -->
  <rect x="460" y="143" width="64" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="492" y="160" text-anchor="middle" font-size="12" fill="#16202a">R6 1 kΩ</text>
  <rect x="460" y="193" width="64" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="492" y="210" text-anchor="middle" font-size="12" fill="#16202a">R7 1 kΩ</text>
  <polygon points="580,149 593,155 580,161" fill="#2563eb"/>
  <text x="602" y="159" fill="#2563eb">L (módulo)</text>
  <polygon points="580,199 593,205 580,211" fill="#2563eb"/>
  <text x="602" y="209" fill="#2563eb">R (módulo)</text>

  <!-- G / grounds -->
  <text x="20" y="254" fill="#16202a">GND do áudio (pino 38)</text>
  <line x1="215" y1="250" x2="500" y2="250" stroke="#16202a" stroke-width="2"/>
  <polygon points="500,244 513,250 500,256" fill="#2563eb"/>
  <text x="523" y="254" fill="#2563eb">G (módulo)</text>

  <text x="350" y="300" text-anchor="middle" fill="#5b6b7a" font-size="12">Sem chave no sinal: divisor (~0,2 Vpp de linha) e amp ficam SEMPRE conectados.</text>
  <text x="350" y="318" text-anchor="middle" fill="#5b6b7a" font-size="12">A seleção A/B é feita na SAÍDA, pela chave dos RCAs (diagrama abaixo).</text>
  <text x="350" y="336" text-anchor="middle" fill="#5b6b7a" font-size="12">LINHA é a junção R4/R5 — na PCB ela já sai no header J4, pino 3.</text>
</svg>
