<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="619" height="219" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Áudio — filtro RC passa-baixa + amplificador</text>

  <!-- pin -->
  <rect x="16" y="70" width="120" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="76" y="89" text-anchor="middle" fill="#16202a">GP18 · AUDIO</text>

  <!-- R3 -->
  <rect x="180" y="73" width="100" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="230" y="90" text-anchor="middle" fill="#16202a">R3 1 kΩ</text>

  <!-- wires -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="136" y1="85" x2="180" y2="85"/>
    <line x1="280" y1="85" x2="348" y2="85"/>
    <line x1="348" y1="85" x2="348" y2="118"/>
    <line x1="348" y1="126" x2="348" y2="150"/>
    <line x1="348" y1="85" x2="420" y2="85"/>
    <line x1="432" y1="85" x2="500" y2="85"/>
  </g>
  <circle cx="348" cy="85" r="3.5" fill="#16202a"/>

  <!-- C1 (shunt to GND) -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="330" y1="118" x2="366" y2="118"/>
    <line x1="330" y1="126" x2="366" y2="126"/>
    <line x1="336" y1="150" x2="360" y2="150"/>
    <line x1="340" y1="155" x2="356" y2="155"/>
    <line x1="344" y1="160" x2="352" y2="160"/>
  </g>
  <text x="376" y="127" fill="#5b6b7a" font-size="12">C1 100 nF</text>

  <!-- C2 (series coupling) -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="420" y1="71" x2="420" y2="99"/>
    <line x1="432" y1="71" x2="432" y2="99"/>
  </g>
  <text x="426" y="62" text-anchor="middle" fill="#5b6b7a" font-size="12">C2 1 µF</text>

  <!-- output -->
  <polygon points="500,79 513,85 500,91" fill="#2563eb"/>
  <text x="520" y="82" fill="#2563eb">→ IN+ amp</text>
  <text x="520" y="98" fill="#5b6b7a" font-size="12">(PAM8403)</text>

  <text x="310" y="206" text-anchor="middle" fill="#5b6b7a" font-size="12">fc ≈ 1,6 kHz  ·  IN− do amp = GND  ·  C2 = acoplamento (opcional)</text>
</svg>
