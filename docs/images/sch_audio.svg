<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="659" height="269" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Áudio — filtro RC + acoplamento + entradas L/R do PAM8403</text>

  <!-- pin -->
  <rect x="16" y="80" width="120" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="76" y="99" text-anchor="middle" fill="#16202a">GP18 · AUDIO</text>

  <!-- R3 -->
  <rect x="166" y="83" width="88" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="210" y="100" text-anchor="middle" fill="#16202a">R3 1 kΩ</text>

  <!-- main wires -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="136" y1="95" x2="166" y2="95"/>
    <line x1="254" y1="95" x2="306" y2="95"/>
    <line x1="314" y1="95" x2="368" y2="95"/>
    <line x1="368" y1="60" x2="368" y2="130"/>
    <line x1="368" y1="60" x2="398" y2="60"/>
    <line x1="368" y1="130" x2="398" y2="130"/>
    <line x1="478" y1="60" x2="530" y2="60"/>
    <line x1="478" y1="130" x2="530" y2="130"/>
  </g>
  <circle cx="280" cy="95" r="3.5" fill="#16202a"/>
  <circle cx="368" cy="95" r="3.5" fill="#16202a"/>

  <!-- C1 shunt to GND -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="280" y1="95" x2="280" y2="120"/>
    <line x1="262" y1="120" x2="298" y2="120"/>
    <line x1="262" y1="128" x2="298" y2="128"/>
    <line x1="280" y1="128" x2="280" y2="148"/>
    <line x1="268" y1="148" x2="292" y2="148"/>
    <line x1="272" y1="153" x2="288" y2="153"/>
    <line x1="276" y1="158" x2="284" y2="158"/>
  </g>
  <text x="254" y="128" text-anchor="end" fill="#5b6b7a" font-size="12">C1 100 nF</text>

  <!-- C2 series -->
  <g stroke="#16202a" stroke-width="2">
    <line x1="306" y1="81" x2="306" y2="109"/>
    <line x1="314" y1="81" x2="314" y2="109"/>
  </g>
  <text x="310" y="72" text-anchor="middle" fill="#5b6b7a" font-size="12">C2 1 µF</text>

  <!-- build-out resistors -->
  <rect x="398" y="48" width="80" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="438" y="65" text-anchor="middle" fill="#16202a">1 kΩ</text>
  <rect x="398" y="118" width="80" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="438" y="135" text-anchor="middle" fill="#16202a">1 kΩ</text>

  <!-- outputs L / R -->
  <polygon points="530,54 543,60 530,66" fill="#2563eb"/>
  <text x="550" y="64" fill="#2563eb">L (módulo)</text>
  <polygon points="530,124 543,130 530,136" fill="#2563eb"/>
  <text x="550" y="134" fill="#2563eb">R (módulo)</text>

  <!-- G (signal ground) -->
  <text x="20" y="204" fill="#16202a">GND (pino 38 do Pico)</text>
  <line x1="200" y1="200" x2="530" y2="200" stroke="#16202a" stroke-width="2"/>
  <polygon points="530,194 543,200 530,206" fill="#2563eb"/>
  <text x="550" y="204" fill="#2563eb">G (módulo)</text>

  <text x="330" y="248" text-anchor="middle" fill="#5b6b7a" font-size="12">fc ≈ 1,6 kHz · C2 bloqueia DC (back-powering) · 2×1 kΩ isolam as entradas L/R</text>
</svg>
