<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="0.5" y="0.5" width="639" height="249" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#16202a">Vídeo composto — DAC de 2 resistores</text>

  <!-- pins -->
  <rect x="16" y="58" width="116" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="74" y="77" text-anchor="middle" fill="#16202a">GP16 · SYNC</text>
  <rect x="16" y="132" width="116" height="30" rx="5" fill="#eef4ff" stroke="#16202a"/>
  <text x="74" y="151" text-anchor="middle" fill="#16202a">GP17 · VIDEO</text>

  <!-- resistors -->
  <rect x="184" y="61" width="104" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="236" y="78" text-anchor="middle" fill="#16202a">R1 470 Ω</text>
  <rect x="184" y="135" width="104" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="236" y="152" text-anchor="middle" fill="#16202a">R2 220 Ω</text>

  <!-- wires -->
  <g stroke="#16202a" stroke-width="2" fill="none">
    <line x1="132" y1="73" x2="184" y2="73"/>
    <line x1="132" y1="147" x2="184" y2="147"/>
    <line x1="288" y1="73" x2="372" y2="73"/>
    <line x1="288" y1="147" x2="372" y2="147"/>
    <line x1="372" y1="73" x2="372" y2="147"/>
    <line x1="372" y1="110" x2="540" y2="110"/>
    <line x1="456" y1="110" x2="456" y2="158"/>
    <line x1="456" y1="182" x2="456" y2="198"/>
  </g>
  <g fill="#16202a">
    <circle cx="372" cy="73" r="3.5"/>
    <circle cx="372" cy="147" r="3.5"/>
    <circle cx="372" cy="110" r="3.5"/>
    <circle cx="456" cy="110" r="3.5"/>
  </g>

  <!-- 75 ohm termination -->
  <rect x="432" y="158" width="48" height="24" rx="3" fill="#ffffff" stroke="#16202a"/>
  <text x="456" y="174" text-anchor="middle" font-size="12" fill="#16202a">75 Ω</text>
  <g stroke="#16202a" stroke-width="2">
    <line x1="444" y1="198" x2="468" y2="198"/>
    <line x1="448" y1="203" x2="464" y2="203"/>
    <line x1="452" y1="208" x2="460" y2="208"/>
  </g>

  <!-- output -->
  <polygon points="540,104 553,110 540,116" fill="#2563eb"/>
  <text x="560" y="106" fill="#2563eb">RCA center</text>
  <text x="560" y="122" fill="#5b6b7a" font-size="12">(composto)</text>

  <text x="320" y="238" text-anchor="middle" fill="#5b6b7a" font-size="12">75 Ω = terminação opcional  ·  shield do RCA → GND</text>
</svg>
