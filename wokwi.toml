# Configuração para a extensão "Wokwi for VS Code".
# 1. Compile o firmware (gera build/pong-rp2040.uf2 e .elf).
# 2. Instale a extensão "Wokwi for VS Code" e faça login (gratuito).
# 3. Abra o diagram.json e rode "Wokwi: Start Simulator".
[wokwi]
version = 1
firmware = 'build/pong-rp2040.uf2'
elf = 'build/pong-rp2040.elf'
